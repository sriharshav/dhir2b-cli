[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dhir2b-cli"
dynamic = ["version"]
description = "Terminal chat for ZenteiQ's Dhīr 2B model: streaming Markdown, syntax highlighting, offline, Apple Silicon friendly."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sriharsha Vardhan", email = "sriharsha.vardhan@gmail.com" }]
requires-python = ">=3.10"
keywords = ["dhir", "llm", "indic", "chat", "cli", "transformers", "apple-silicon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Natural Language :: Hindi",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch",
    "transformers>=5",
    "accelerate",
    "huggingface_hub",
    "rich",
    "gnureadline; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["ruff"]

[project.scripts]
dhir2b = "dhir2b:main"

[project.urls]
Homepage = "https://github.com/sriharshav/dhir2b-cli"
Issues = "https://github.com/sriharshav/dhir2b-cli/issues"
Model = "https://huggingface.co/zenteiq-ai/Dhir-2B"

[tool.setuptools]
py-modules = ["dhir2b"]

[tool.setuptools.dynamic]
version = { attr = "dhir2b.__version__" }

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E402"]  # imports follow the logging setup on purpose
