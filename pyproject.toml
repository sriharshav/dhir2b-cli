[build-system]
# Homebrew's Python leaks its own old setuptools/packaging into pip's isolated build,
# so keep metadata readable by older tools (see the `license` table below).
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dhir2b-cli"
dynamic = ["version"]
description = "Terminal chat for ZenteiQ's Dhīr 2B model: streaming Markdown, syntax highlighting, offline, Apple Silicon friendly."
readme = "README.md"
license = { text = "Apache-2.0" }  # table form: older build tools can't parse the "Apache-2.0" string form
authors = [{ name = "Sriharsha Vardhan", email = "sriharsha.vardhan@gmail.com" }]
requires-python = ">=3.10"
keywords = ["dhir", "llm", "indic", "chat", "cli", "transformers", "apple-silicon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Natural Language :: Hindi",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch",
    "transformers>=5",
    "accelerate",
    "huggingface_hub",
    "rich",
    "gnureadline; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["ruff"]

[project.scripts]
dhir2b = "dhir2b:main"

[project.urls]
Homepage = "https://github.com/sriharshav/dhir2b-cli"
Issues = "https://github.com/sriharshav/dhir2b-cli/issues"
Model = "https://huggingface.co/zenteiq-ai/Dhir-2B"

[tool.hatch.version]
path = "dhir2b.py"

[tool.hatch.build.targets.wheel]
only-include = ["dhir2b.py"]

[tool.hatch.build.targets.sdist]
include = ["dhir2b.py", "tests/", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E402"]  # imports follow the logging setup on purpose
